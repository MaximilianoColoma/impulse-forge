# Synapse static SPA config for the internal nginx container (tunnel backend).
# Listens on 8080 only; Cloudflare tunnel terminates external HTTPS.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable and cacheable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker + registration must always revalidate so PWA updates land.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; }
    location ~ ^/workbox-.*\.js$ { add_header Cache-Control "no-cache"; }

    # SPA fallback: unknown paths render index.html so client routes
    # like /reset-password, /auth, /dashboard resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static-server hygiene headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
