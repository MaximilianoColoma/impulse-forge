# Synapse — nginx server block for synapse.billionex.io
# Copy to /etc/nginx/sites-available/synapse.billionex.io.conf and symlink
# into /etc/nginx/sites-enabled before reloading. Certbot populates the
# ssl_certificate paths when `certbot --nginx -d synapse.billionex.io` runs.
#
# The app is a static Vite SPA; nginx serves dist and does the SPA fallback.
# Supabase is the backend (Auth/DB/Edge-Functions), reached from the browser,
# and is wired at build time via VITE_* env (see deploy/deploy-build.sh).

# --- HTTP -> redirect to HTTPS, ACME hook ---
server {
    listen 80;
    listen [::]:80;
    server_name synapse.billionex.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name synapse.billionex.io;

    ssl_certificate     /etc/letsencrypt/live/synapse.billionex.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synapse.billionex.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /srv/synapse/current;
    index index.html;

    # Serve hashed assets long-lived (immutable) for caching.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker must always be revalidated so PWA updates land.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /workbox-*.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths render index.html so client routes
    # like /reset-password, /auth, /dashboard resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable static-server security/transport headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
